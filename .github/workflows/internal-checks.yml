name: Internal checks

# zedu-hng/zedu-fe is a fork of zeduchat/zedu-fe, so GitHub never runs pull_request (or
# pull_request_target) workflows when a PR's head branch lives in this repository itself. Every run of
# "PR checks" / "PR scans" comes from an external fork, so an internal branch pushed straight to this
# repo is never checked. See issue #770.
#
# push events DO fire in this repo, so this companion runs the same core checks on a pushed branch and
# posts the results as commit statuses (same contexts as the fork suite). Fork PRs are unaffected: this
# workflow never runs for their head branches, which live in another repo.

on:
  push:
    branches-ignore:
      - dev
      - central-staging
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-checks-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Internal checks
    if: github.repository == 'zedu-hng/zedu-fe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Base is the open PR's base when one exists (an internal PR), otherwise dev.
      - name: Resolve base
        id: ctx
        run: |
          owner="${REPO%%/*}"
          base=dev
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRepositoryOwner \
            | jq -r --arg owner "$owner" 'map(select(.headRepositoryOwner.login == $owner))[0].number // empty')
          if [ -n "$pr" ]; then
            base=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json baseRefName,headRepositoryOwner \
              | jq -r --arg owner "$owner" 'map(select(.headRepositoryOwner.login == $owner))[0].baseRefName')
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git fetch -q --no-tags origin "$base"
          echo "Checked branch '$BRANCH' against '$base' (PR: ${pr:-none})."

      - name: File policy
        id: file_policy
        continue-on-error: true
        env:
          BASE: ${{ steps.ctx.outputs.base }}
        run: bash .github/scripts/verify-changed-files.sh "origin/$BASE" HEAD

      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --config .gitleaks.toml --redact --no-banner

      - name: Malware heuristics
        id: heuristics
        continue-on-error: true
        run: node .github/scripts/scan-malware.mjs

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.27.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Prepare TypeScript environment
        if: steps.install.outcome == 'success'
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Commit messages
        id: commitlint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          BASE: ${{ steps.ctx.outputs.base }}
        run: pnpm exec commitlint --from "$(git merge-base "origin/$BASE" HEAD)" --to HEAD --verbose

      - name: Dependency audit
        id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm audit --audit-level moderate || true
          pnpm audit --audit-level critical

      - name: Prettier
        id: prettier
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run check-format

      - name: ESLint
        id: eslint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run check-lint

      - name: TypeScript
        id: types
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run check-types

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run build

      # Publish each result as a commit status on the head commit, using the same contexts as the fork
      # suite so an internal PR shows the same checks (and branch protection, if any, can require them).
      - name: Results
        if: always()
        env:
          FILE_POLICY: ${{ steps.file_policy.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          HEURISTICS: ${{ steps.heuristics.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          COMMITLINT: ${{ steps.commitlint.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PRETTIER: ${{ steps.prettier.outcome }}
          ESLINT: ${{ steps.eslint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=0
          post() { # context outcome
            local state desc
            case "$2" in
              success) state=success; desc="Passed" ;;
              skipped)
                if [ "$INSTALL" = failure ]; then desc="Not run: dependency install failed"
                else desc="Not run"; fi
                state=failure; failed=$((failed + 1)) ;;
              *) state=failure; desc="${2:-not run}"; failed=$((failed + 1)) ;;
            esac
            jq -n --arg state "$state" --arg context "$1" --arg description "$desc" --arg url "$RUN_URL" \
              '{state: $state, context: $context, description: $description, target_url: $url}' \
              | gh api -X POST "repos/$REPO/statuses/$SHA" --input - >/dev/null
            echo "| $1 | $state: $desc |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### Internal checks for \`${SHA:0:7}\` on \`$BRANCH\`"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          post "File policy" "$FILE_POLICY"
          post "Gitleaks" "$GITLEAKS"
          post "Malware heuristics" "$HEURISTICS"
          post "Commit messages" "$COMMITLINT"
          post "Dependency audit" "$AUDIT"
          post "Prettier" "$PRETTIER"
          post "ESLint" "$ESLINT"
          post "TypeScript" "$TYPES"
          post "Build" "$BUILD"
          [ "$failed" = 0 ] || { echo "::error::$failed check(s) failed; see the summary above."; exit 1; }
